[project]
name = "nfl-prop-model"
version = "0.1.0"
description = "Local-first NFL player prop projection and pricing MVP"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "duckdb>=1.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
